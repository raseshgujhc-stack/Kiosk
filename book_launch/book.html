<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>eGujHC Vision Document</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="./lib/css/main.css" rel="stylesheet" type="text/css">
  <link href="./lib/css/themify-icons.min.css" rel="stylesheet" type="text/css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(148, 118, 45, 0.28), transparent 36%),
        linear-gradient(180deg, #1d140d 0%, #090909 100%);
      color: #fff;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .book-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 96px 28px 28px;
    }

    .book-header {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 1280px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      text-align: center;
      border: 1px solid rgba(255, 231, 179, 0.35);
      border-radius: 18px;
      background: rgba(16, 11, 8, 0.78);
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.32);
      z-index: 30;
    }

    .book-heading {
      font-size: clamp(20px, 2.2vw, 34px);
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #fff5d6;
    }

    .control-btn {
      position: absolute;
      top: 20px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 231, 179, 0.32);
      border-radius: 12px;
      background: rgba(15, 15, 15, 0.84);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      z-index: 35;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .control-btn:hover {
      transform: translateY(-1px);
      background: rgba(52, 36, 18, 0.92);
    }

    .back-btn {
      left: 20px;
    }

    .music-btn {
      right: 20px;
    }

    .music-btn[hidden] {
      display: none;
    }

    #flipbookContainer {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
    }

    @media (max-width: 768px) {
      .book-shell {
        padding: 106px 12px 18px;
      }

      .book-header {
        width: calc(100vw - 24px);
        top: 66px;
        padding: 12px 16px;
      }

      .control-btn {
        top: 14px;
        padding: 10px 14px;
        font-size: 13px;
      }

      .back-btn {
        left: 12px;
      }

      .music-btn {
        right: 12px;
      }
    }
  </style>
</head>

<body>
  <button class="control-btn back-btn" type="button" onclick="goBack()">← Back</button>
  <button class="control-btn music-btn" id="musicBtn" type="button" onclick="toggleMusic()" hidden>Music: On</button>

  <div class="book-header">
    <div class="book-heading">eGujHC Vision Document</div>
  </div>

  <div class="book-shell">
    <div id="flipbookContainer"></div>
  </div>

  <audio id="backgroundMusic" loop preload="auto"></audio>

  <script src="./lib/js/libs/jquery.min.js" type="text/javascript"></script>
  <script src="./lib/js/flip.js" type="text/javascript"></script>
  <script>
    const backgroundMusicCandidates = ["./books/soft-music.mp3"];
    const pageImages = Array.from(
      { length: 120 },
      (_, index) => `./books/eGujHC_pages/page-${String(index + 1).padStart(3, "0")}.jpg`
    );

    let backgroundMusicReady = false;
    let backgroundMusicEnabled = true;

    function ensureBackgroundMusicPlayback() {
      const music = document.getElementById("backgroundMusic");
      if (!music || !backgroundMusicReady || !backgroundMusicEnabled) return;
      if (!music.paused) return;

      music.play().catch(() => { });
    }

    function registerBackgroundMusicWakeEvents() {
      const wakeMusic = () => {
        ensureBackgroundMusicPlayback();
      };

      ["pointerdown", "touchstart", "keydown"].forEach((eventName) => {
        document.addEventListener(eventName, wakeMusic, { passive: true });
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          ensureBackgroundMusicPlayback();
        }
      });
    }

    function goBack() {
      window.location.href = "../index.html";
    }

    function updateMusicButton() {
      const musicBtn = document.getElementById("musicBtn");
      if (!backgroundMusicReady) {
        musicBtn.hidden = true;
        return;
      }

      musicBtn.hidden = false;
      musicBtn.textContent = backgroundMusicEnabled ? "Music: On" : "Music: Off";
    }

    function toggleMusic() {
      if (!backgroundMusicReady) return;

      const music = document.getElementById("backgroundMusic");
      backgroundMusicEnabled = !backgroundMusicEnabled;

      if (backgroundMusicEnabled) {
        ensureBackgroundMusicPlayback();
      } else {
        music.pause();
      }

      updateMusicButton();
    }

    function tryLoadBackgroundMusic(index) {
      const music = document.getElementById("backgroundMusic");

      if (index >= backgroundMusicCandidates.length) {
        backgroundMusicReady = false;
        updateMusicButton();
        console.warn("No background music file found in book_launch/books/.");
        return;
      }

      const source = backgroundMusicCandidates[index];

      const handleCanPlay = () => {
        music.removeEventListener("canplaythrough", handleCanPlay);
        music.removeEventListener("error", handleError);
        backgroundMusicReady = true;
        music.volume = 0.18;
        updateMusicButton();
        ensureBackgroundMusicPlayback();
      };

      const handleError = () => {
        music.removeEventListener("canplaythrough", handleCanPlay);
        music.removeEventListener("error", handleError);
        tryLoadBackgroundMusic(index + 1);
      };

      music.addEventListener("canplaythrough", handleCanPlay, { once: true });
      music.addEventListener("error", handleError, { once: true });
      music.src = source;
      music.load();
    }

    jQuery(document).ready(function () {
      const options = {
        height: "100%",
        duration: 900,
        backgroundColor: "#120e0a",
        webgl: false,
        transparent: false,
        forceFit: true,
        soundEnable: false,
        soundFile: "./lib/sound/turn2.mp3",
        images: pageImages,
        pageCount: pageImages.length,
        autoPlay: true,
        autoPlayStart: true,
        autoPlayDuration: 30000
      };

      jQuery("#flipbookContainer").flipBook(pageImages, options);
      registerBackgroundMusicWakeEvents();
      tryLoadBackgroundMusic(0);
    });
  </script>
</body>

</html>
